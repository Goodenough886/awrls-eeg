[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "awrls3-research"
version = "3.0.0.dev1"
description = "Audited single-channel EEG artifact suppression and optional residual TCN"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.12", "pandas>=2.1", "PyWavelets==1.8.0"]

[project.optional-dependencies]
neural = ["torch>=2.8"]
plots = ["matplotlib>=3.8"]

[tool.setuptools]
packages = ["awrls2", "awrls3"]
